name: Daily Data Update

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests idc-index pyarrow openpyxl

      - name: Fetch data
        run: python fetch_data.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wp_metadata.parquet idc_metadata.parquet gc_metadata.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily metadata update" && git push)
